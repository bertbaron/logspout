version: "2"

linters:
  default: standard
  disable:
    - dupl
    - err113
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - godot
    - nolintlint
    - testpackage
    - wsl
    - prealloc
  settings:
    errcheck:
      exclude-functions:
        - net/http.(*Response).Write
        - io.WriteString
    gocyclo:
      min-complexity: 12
    goconst:
      min-len: 2
      min-occurrences: 2
    lll:
      line-length: 160
    goimports:
      local-prefixes: github.com/gliderlabs/logspout
    gocritic:
      settings:
        hugeParam:
          sizeThreshold: 160
      enabled-tags:
        - performance
    nakedret:
      max-func-lines: 65
    misspell:
      locale: US
  exclusions:
    rules:
      - path: "_test\\.go$"
        linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - lll
          - nakedret
          - unparam
          - funlen

run:
  timeout: 2m
